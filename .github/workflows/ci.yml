# CI skyward — check, lint, test, build (api + web).
#
# Hanya verifikasi. Build & deploy dilakukan DI VPS lewat webhook
# (lihat ops/README.md), sama seperti project Qouver lain.
# Tanpa registry, tanpa secrets GitHub.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: gofmt (berkas yang berubah)
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then base="$EVENT_BEFORE"; fi
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Basis perubahan tidak tersedia; melaporkan drift gofmt saat ini:"
            gofmt -l api || true
            exit 0
          fi
          changed="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'apps/api' | grep '\.go$' || true)"
          if [ -z "$changed" ]; then echo "Tidak ada berkas Go yang berubah."; exit 0; fi
          bad="$(printf '%s\n' "$changed" | xargs gofmt -l)"
          if [ -n "$bad" ]; then
            echo "Berkas Go berikut belum gofmt-clean:"; printf '%s\n' "$bad"; exit 1
          fi
          echo "Semua berkas Go yang berubah sudah gofmt-clean."

      - name: go test ./...
        run: go test ./...

  db-tests:
    name: API (Go) dengan Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skyward
          POSTGRES_PASSWORD: skyward
          POSTGRES_DB: skyward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://skyward:skyward@localhost:5432/skyward_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Terapkan migrasi
        working-directory: .
        env:
          PGPASSWORD: skyward
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U skyward -d skyward_test \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='postgres') THEN CREATE ROLE postgres NOLOGIN; END IF; END \$\$;"
          for f in $(ls migrations/*.sql | sort); do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U skyward -d skyward_test -f "$f" >/dev/null
          done

      - name: go test ./... (-p 1, DB bersama)
        run: go test -p 1 ./...

  web:
    name: Web (check + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Check (svelte-check)
        run: pnpm check

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
